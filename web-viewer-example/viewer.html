<!doctype html>
<!--
  Reference viewer for NexusScan's output -- NOT part of the plugin itself, and not meant to be
  used as-is. This is here so whoever wires the Base44/Kairos tab together has a working example
  of how to turn manifest.json + the tiles/ folder into a pannable, zoomable map, using Leaflet
  (the same kind of library Dynmap/BlueMap's own web front ends use). Point DATA_BASE_URL at
  wherever manifest.json and the tiles/ folder actually get served from once they're synced off
  the Minecraft server, then adapt the styling/embedding to fit the real site.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>NexusScan reference viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; background: #111; }
  #status { position: absolute; z-index: 1000; top: 8px; left: 8px; background: rgba(0,0,0,0.6);
    color: #eee; font: 12px monospace; padding: 6px 10px; border-radius: 4px; }
</style>
</head>
<body>
<div id="status">Loading manifest...</div>
<div id="map"></div>
<script>
  // Change this to wherever manifest.json + tiles/ actually live once synced off the server.
  const DATA_BASE_URL = ".";
  const TILE_PIXELS = 16; // each tile image is 16x16, one pixel per block column

  fetch(DATA_BASE_URL + "/manifest.json")
    .then(response => response.json())
    .then(manifest => {
      document.getElementById("status").textContent =
        manifest.tileCount + " chunks rendered -- last scan " + manifest.lastScan;

      const map = L.map("map", { crs: L.CRS.Simple, minZoom: -4, maxZoom: 4 });

      // A custom tile layer that maps Leaflet's z/x/y tile grid directly onto NexusScan's
      // one-tile-per-chunk files, using manifest.tilePathPattern instead of hardcoding it.
      const NexusScanLayer = L.GridLayer.extend({
        createTile: function (coords, done) {
          const tile = document.createElement("img");
          const chunkX = coords.x;
          const chunkZ = coords.y;
          tile.src = DATA_BASE_URL + "/" +
            manifest.tilePathPattern.replace("{x}", chunkX).replace("{z}", chunkZ);
          tile.onerror = () => { tile.style.visibility = "hidden"; done(null, tile); };
          tile.onload = () => done(null, tile);
          tile.style.imageRendering = "pixelated";
          return tile;
        }
      });

      new NexusScanLayer({ tileSize: TILE_PIXELS, noWrap: true }).addTo(map);

      const centerX = (manifest.bounds.minChunkX + manifest.bounds.maxChunkX) / 2;
      const centerZ = (manifest.bounds.minChunkZ + manifest.bounds.maxChunkZ) / 2;
      map.setView([-centerZ, centerX], 0);
    })
    .catch(err => {
      document.getElementById("status").textContent = "Couldn't load manifest.json: " + err;
    });
</script>
</body>
</html>
